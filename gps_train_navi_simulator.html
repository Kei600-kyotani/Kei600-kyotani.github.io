<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#242424">
<meta name="description" content="GPS Train Navi風の個人学習用・鉄道案内画面シミュレーター">
<title>GPS Train Navi風・画面シミュレーター</title>
<style>
:root{--yellow:#f5d800;--green:#176b36;--black:#111;--panel:#eee}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171717;font-family:Arial,"Noto Sans JP",sans-serif;color:#111}
body{display:flex;align-items:center;justify-content:center}
#app{width:100vw;height:100dvh;display:flex;flex-direction:column;background:#222;max-width:1600px;max-height:1000px;border:2px solid #555}
.status{height:7.5%;min-height:28px;background:#c9c9c9;border-bottom:3px solid #111;display:grid;grid-template-columns:1.2fr 1fr 1fr;align-items:center;padding:0 1.2%;font-weight:bold;font-size:clamp(11px,2.2vh,20px)}
.brand{letter-spacing:.03em}.metrics{text-align:center;font-size:clamp(10px,1.8vh,16px)}.indicators{text-align:right;white-space:nowrap}.gpsdot{display:inline-block;width:.65em;height:.65em;border-radius:50%;background:#888;margin:0 .25em}.gpsdot.on{background:#00a52b;box-shadow:0 0 5px #00a52b}
.main{height:92.5%;display:grid;grid-template-columns:3fr 1fr;min-height:0}
.left{display:grid;grid-template-rows:1fr 1fr;min-width:0;min-height:0;border-right:6px solid #050505}
.service{display:flex;align-items:center;justify-content:center;border-bottom:6px solid #050505;background:#fff;font-size:clamp(54px,15vw, min(24vh,210px));font-weight:900;line-height:1;letter-spacing:.04em;text-align:center}
.service.local{color:#111;background:#fff}.service.rapid{color:#fff;background:#ff8000}.service.special{color:#fff;background:#0066cc}.service.limited{color:#fff;background:#d00000}
.next{display:flex;align-items:center;justify-content:center;flex-direction:column;background:#eee;text-align:center;min-height:0;padding:2%;font-weight:900}
.station{font-size:clamp(46px,12vw,min(20vh,170px));line-height:1.1;letter-spacing:.08em;overflow-wrap:anywhere}
.subline{font-size:clamp(16px,3vh,28px);margin-top:1.5%;font-weight:800}
.right{background:var(--yellow);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3% 4%;min-width:0}
.trainno{align-self:flex-start;font-size:clamp(15px,3vh,26px);font-weight:900}
.cars{font-size:clamp(100px,27vw,min(48vh,390px));font-weight:900;line-height:.95}
.cars small{font-size:.28em;vertical-align:baseline}
.menu{width:100%;min-height:18%;border:5px solid var(--green);border-radius:2px;background:linear-gradient(#fff,#dcebdc);color:#123c20;font-size:clamp(18px,4vh,34px);font-weight:900;box-shadow:inset 0 0 0 2px #fff}
.menu:active,button:active{filter:brightness(.88)}
.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:3%;z-index:5}
.overlay.open{display:flex}
.dialog{width:min(760px,96vw);max-height:92dvh;overflow:auto;background:#d8d8d8;border:4px solid #111;box-shadow:0 8px 30px #000b;padding:14px}
.dtitle{background:#333;color:#fff;padding:9px 12px;font-weight:900;font-size:20px;margin:-14px -14px 12px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-weight:bold;font-size:14px}
input,select{width:100%;min-height:40px;font-size:17px;padding:6px;border:2px solid #555;background:#fff;color:#111}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
button.action{min-height:44px;border:2px solid #164d2a;background:#e9f2e9;font-size:16px;font-weight:bold;color:#111}
button.warn{border-color:#8b2020;background:#ffe6e6}
.note{font-size:12px;line-height:1.5;margin-top:12px;padding:9px;background:#fff3c2;border:1px solid #8a7110}
.readout{font-size:12px;margin-top:8px;line-height:1.5}
.alert .service,.alert .next{background:#fff!important;color:#111!important}
.alert .station{font-size:clamp(58px,14vw,min(24vh,210px))}
@media (orientation:portrait){#app{width:100vw;height:100dvh}.status{height:8%}.main{height:92%;grid-template-columns:1fr;grid-template-rows:1fr 28%}.left{border-right:0;border-bottom:5px solid #111}.service{font-size:clamp(54px,14vw,130px)}.station{font-size:clamp(40px,11vw,100px)}.right{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;padding:4px 8px}.trainno{grid-column:1}.cars{grid-column:2;grid-row:1/3;font-size:clamp(70px,18vw,130px)}.menu{grid-column:1;grid-row:2;min-height:0;height:90%}}
@media (max-height:420px) and (orientation:landscape){.status{min-height:22px}.service{font-size:clamp(44px,14vh,105px)}.station{font-size:clamp(40px,13vh,100px)}.cars{font-size:clamp(75px,35vh,200px)}.menu{min-height:22%;font-size:clamp(16px,5vh,25px)}}
</style>
</head>
<body>
<div id="app">
 <header class="status">
  <div class="brand">GPS Train Navi <span style="font-size:.7em">SIM</span></div>
  <div class="metrics"><span id="speed">0</span> km/h　次駅 <span id="distance">--</span></div>
  <div class="indicators"><span id="battery">▰▰▰</span>　<span class="gpsdot" id="gpsdot"></span><span id="gpslabel">GPS未接続</span></div>
 </header>
 <main class="main" id="main">
  <section class="left">
   <div class="service local" id="service">普通</div>
   <div class="next" id="nextbox"><div class="station" id="station">大阪</div><div class="subline" id="subline">次の停車駅</div></div>
  </section>
  <aside class="right">
   <div class="trainno" id="trainno">3420M</div>
   <div class="cars" id="cars">8</div>
   <button class="menu" id="openmenu">メニュー</button>
  </aside>
 </main>
</div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="設定">
 <div class="dialog">
  <div class="dtitle">運転情報・表示設定（シミュレーター）</div>
  <div class="formgrid">
   <label class="field">路線<select id="route"><option value="kyoto">JR京都線（テストデータ）</option></select></label>
   <label class="field">進行方向<select id="direction"><option value="east">京都方面</option><option value="west">大阪方面</option></select></label>
   <label class="field">列車種別<select id="kind"><option>普通</option><option>快速</option><option>新快速</option><option>特急</option></select></label>
   <label class="field">編成両数<select id="count"><option>4</option><option>6</option><option selected>8</option><option>12</option></select></label>
   <label class="field">列車番号<input id="number" value="3420M" maxlength="12"></label>
   <label class="field">デモ速度<select id="demospeed"><option value="35">低速</option><option value="65" selected>標準</option><option value="100">高速</option></select></label>
  </div>
  <div class="actions">
   <button class="action" id="apply">設定を反映</button>
   <button class="action" id="gpsstart">GPS位置取得開始</button>
   <button class="action" id="gpsstop">GPS停止</button>
   <button class="action" id="demostart">デモ走行開始</button>
   <button class="action" id="demoreset">デモ走行リセット</button>
   <button class="action warn" id="close">閉じる</button>
  </div>
  <div class="readout" id="gpsreadout">GPS位置：未取得</div>
  <div class="note"><b>重要：</b>これは個人学習用の画面・動作サンプルです。実際のJR西日本の装置画面や制御ロジックを再現・認証したものではありません。GPS誤差・通信断・端末性能などにより誤表示するため、実車・営業運転・線路内での使用、運転判断や安全確認への利用は絶対にしないでください。駅座標は概略のテスト値です。</div>
 </div>
</div>
<script>
"use strict";
// 駅座標は概略値。デモ用の直線距離判定であり、実際の線路形状・キロ程ではありません。
const stations=[
 {name:"大阪",lat:34.7025,lon:135.4959,stop:["普通","快速","新快速","特急"]},
 {name:"新大阪",lat:34.7335,lon:135.5001,stop:["普通","快速","新快速","特急"]},
 {name:"茨木",lat:34.8163,lon:135.5629,stop:["普通","快速"]},
 {name:"高槻",lat:34.8518,lon:135.6177,stop:["普通","快速","新快速"]},
 {name:"京都",lat:34.9855,lon:135.7588,stop:["普通","快速","新快速","特急"]}
];
const $=id=>document.getElementById(id);
let kind="普通",cars=8,trainNo="3420M",direction="east",index=1;
let demoTimer=null,demoDistance=2200,demoSpeed=65,watchId=null,lastPhase=-1,spoken=new Set(),gpsPoint=null;
const rad=x=>x*Math.PI/180;
function dist(a,b){const R=6371000,dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon),x=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function route(){return direction==="east"?stations:[...stations].reverse()}
function currentNext(){const r=route();return r[Math.min(index,r.length-1)]}
function speak(t,key){if(spoken.has(key))return;spoken.add(key);if("speechSynthesis"in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=1.05;speechSynthesis.speak(u)}}
function serviceClass(k){return {"普通":"local","快速":"rapid","新快速":"special","特急":"limited"}[k]||"local"}
function setDistance(m){$("distance").textContent=m>=1000?(m/1000).toFixed(1)+"km":Math.round(m)+"m"}
function render(m=2200,speed=0){
 const r=route(),next=currentNext(),stopped=next.stop.includes(kind);
 $("speed").textContent=Math.round(speed);setDistance(m);
 $("service").className="service "+serviceClass(kind);$("service").textContent=kind;
 $("trainno").textContent=trainNo;$("cars").textContent=cars;
 $("main").classList.remove("alert");
 if(!stopped){$("station").textContent=next.name+" 通過";$("subline").textContent="通過駅（デモ表示）";return}
 if(m<=200){
  $("main").classList.add("alert");$("station").textContent="停目確認";$("subline").textContent=cars+"両停車";
  if(lastPhase!==2){speak("停目確認。"+cars+"両停車", "stopmark-"+index);lastPhase=2}
 }else if(m<=800){
  $("main").classList.add("alert");$("station").textContent="停　車";$("subline").textContent="停車位置案内（シミュレーション）";
  if(lastPhase!==1){speak("停車、停車、停車", "brake-"+index);lastPhase=1}
 }else{
  $("station").textContent=next.name;$("subline").textContent="次の停車駅";
  if(lastPhase!==0)lastPhase=0;
 }
}
function advanceStation(){index++;lastPhase=-1;spoken.clear();if(index>=route().length){stopDemo();$("subline").textContent="デモ区間終了";$("speed").textContent="0";return false}demoDistance=2200;return true}
function demoTick(){
 const v=demoSpeed/3.6;demoDistance-=v*0.5;
 if(demoDistance<=0){if(!advanceStation())return}
 render(Math.max(0,demoDistance),demoSpeed);
}
function stopDemo(){if(demoTimer){clearInterval(demoTimer);demoTimer=null}}
function resetDemo(){stopDemo();index=1;demoDistance=2200;lastPhase=-1;spoken.clear();render(demoDistance,0)}
$("openmenu").onclick=()=>$("overlay").classList.add("open");
$("close").onclick=()=>$("overlay").classList.remove("open");
$("apply").onclick=()=>{kind=$("kind").value;cars=Number($("count").value);trainNo=$("number").value.trim()||"----";direction=$("direction").value;index=1;lastPhase=-1;spoken.clear();render(demoDistance,0);};
$("demostart").onclick=()=>{stopDemo();demoSpeed=Number($("demospeed").value);if(!("speechSynthesis"in window))$("gpsreadout").textContent="このブラウザでは音声読み上げに対応していません";demoTimer=setInterval(demoTick,500);$("overlay").classList.remove("open");};
$("demoreset").onclick=resetDemo;
$("gpsstart").onclick=()=>{
 if(!navigator.geolocation){$("gpsreadout").textContent="Geolocation API非対応";return}
 if(!window.isSecureContext){$("gpsreadout").textContent="GPS取得にはHTTPSまたはlocalhostが必要です";return}
 if(watchId!==null)navigator.geolocation.clearWatch(watchId);
 watchId=navigator.geolocation.watchPosition(p=>{
  gpsPoint={lat:p.coords.latitude,lon:p.coords.longitude};$("gpsdot").classList.add("on");$("gpslabel").textContent="GPS取得中";
  $("gpsreadout").textContent=`GPS位置：${gpsPoint.lat.toFixed(5)}, ${gpsPoint.lon.toFixed(5)} ／ 精度 約${Math.round(p.coords.accuracy)}m ／ 速度 ${p.coords.speed==null?"不明":Math.round(p.coords.speed*3.6)+"km/h"}`;
  // GPSは位置・精度の確認表示のみ。停車警告や運転判断には接続しません。
 },e=>{$("gpsreadout").textContent="GPS取得エラー："+e.message;$("gpsdot").classList.remove("on");$("gpslabel").textContent="GPSエラー"},{enableHighAccuracy:true,maximumAge:2000,timeout:12000});
};
$("gpsstop").onclick=()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;$("gpsdot").classList.remove("on");$("gpslabel").textContent="GPS停止";$("gpsreadout").textContent="GPS位置取得を停止しました";};
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopDemo()});
if("wakeLock"in navigator){let lock;const requestLock=async()=>{try{lock=await navigator.wakeLock.request("screen")}catch(e){}};document.addEventListener("visibilitychange",()=>{if(!document.hidden)requestLock()});requestLock()}
render();
</script>
</body>
</html>
